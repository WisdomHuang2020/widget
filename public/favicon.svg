<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Power Widget —— favicon
    站群 favicon 规范（2026-09-30 定）：不追求"让人认出具体物件"，
    而是取本站最具辨识度的"象形笔画"，6 站同风格、16px 下彼此可区分。
    本站笔画 = 等号（"得出结果的那一步"，也是计算器最简的视觉签名）。
    配色：深底 #0a0a0a / teal #14b8a6 主线 / amber #f59e0b 仅标关键点。
    amber 只落在第二横（关键的"答案"那一笔），第一横用 teal 作衬托。
  -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <g stroke-linecap="round">
    <line x1="7.5" y1="12.2" x2="24.5" y2="12.2" stroke="#14b8a6" stroke-width="3"/>
    <line x1="7.5" y1="20.2" x2="24.5" y2="20.2" stroke="#f59e0b" stroke-width="3"/>
  </g>
</svg>

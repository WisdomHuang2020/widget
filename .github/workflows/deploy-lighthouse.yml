name: Deploy to Tencent Lighthouse

# ═══ 联合部署：一次 push，同步发布到两个自有域名 ═══
#
#   A · widget.power-knowledge.tech  →  150.158.164.41（lhins-n1uhxlwk，站群机）/var/www/widget
#   B · www.wx-seastar.cn            →  43.142.148.37（lhins-6i7vay90，DSH 机）/var/www/widget
#
# 两者跑的是**同一份构建产物**（widget 项目在 Windows 与 CI Linux 上构建产物逐字节一致，
# 已实测），只是发布到两台不同的服务器、对外两个域名。
#
# 为什么拆成两个独立 job 而不是一个 job 里两步：
#   1. **失败隔离** —— A 的密钥配错或服务器不可达时，B 照样部署成功，不会一起挂；
#   2. **并行执行** —— 两个 job 同时在两个 runner 上跑，墙钟时间约等于单站；
#   3. 代价只是多构建一次（约 15 s），换来的是互不拖累。
#   注：两个 job 之间没有 needs 依赖，所以天然并行，不需要 fail-fast: false。
#
# 第三个部署目标 GitHub Pages（兜底）由 deploy.yml 单独负责，与本文件互不阻塞。
#
# 每个 job 的护栏与原单站版本完全一致：
#   未配 secrets 时优雅跳过 / 降级护栏 / 上传前备份 / tar over ssh /
#   --no-same-owner + chown / 写版本哨兵 / 自检不阻断。
#
# 所需 repository secrets（两组，命名前缀区分）：
#   ── A 组（第一台）──
#   LH_HOST     150.158.164.41
#   LH_USER     root
#   LH_ROOT     /var/www/widget
#   LH_SSH_KEY  ~/.ssh/widget_ci 私钥全文
#   LH_PORT     可选，缺省 22
#   ── B 组（第二台）──
#   LH2_HOST    43.142.148.37
#   LH2_USER    root
#   LH2_ROOT    /var/www/widget
#   LH2_SSH_KEY ~/.ssh/deepseek_ops 私钥全文
#   LH2_PORT    可选，缺省 22
#
# ⚠️ 未配置的组会走「优雅跳过」——job 级仍显示成功（假绿），
#    判断是否真的部署了必须下钻到步骤级，确认 `Deploy to server over SSH` 是 success 而非 skipped。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "lighthouse"
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════
  # A · 第一台（站群机）
  # ═══════════════════════════════════════════════════════
  deploy-primary:
    name: A · widget.power-knowledge.tech
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 前置判定：密钥未配置时优雅跳过，而不是让流水线变红。
      # ⚠️ 注意这个分支是「假绿」来源：job 会显示成功，但后面所有步骤都 skipped。
      - name: Check configuration
        id: cfg
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
          LH_USER: ${{ secrets.LH_USER }}
          LH_ROOT: ${{ secrets.LH_ROOT }}
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
        run: |
          if [ -z "$LH_HOST" ] || [ -z "$LH_USER" ] || [ -z "$LH_ROOT" ] || [ -z "$LH_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=已跳过轻量云部署（A 组）::未配置 LH_HOST/LH_USER/LH_ROOT/LH_SSH_KEY，本次不上传任何文件。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "A 组配置齐备，将部署到 $LH_USER@$LH_HOST:$LH_ROOT"
          fi

      - name: Setup Node
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      # 本站不设 Lint 门禁：package.json 中未声明 `lint` 脚本，也未安装 eslint 工具链；
      # 类型检查由 Build 步的 `tsc -b` 承担。
      # vite.config.ts 把 package.json 的 version 经 define 注入 __APP_VERSION__，
      # 由页头徽标与页脚渲染为 `vX.Y.Z`，作为线上核验的指纹锚点。
      - name: Build
        if: steps.cfg.outputs.ready == 'true'
        run: npm run build

      - name: Deploy to server over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
          LH_USER: ${{ secrets.LH_USER }}
          LH_ROOT: ${{ secrets.LH_ROOT }}
          LH_SSH_KEY: ${{ secrets.LH_SSH_KEY }}
          LH_PORT: ${{ secrets.LH_PORT }}
        run: |
          set -euo pipefail
          PORT="${LH_PORT:-22}"
          WEB_OWNER=www-data

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$LH_SSH_KEY" > ~/.ssh/lh_key
          chmod 600 ~/.ssh/lh_key
          ssh-keyscan -p "$PORT" -H "$LH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_CMD="ssh -p $PORT -i $HOME/.ssh/lh_key -o BatchMode=yes -o ConnectTimeout=20 $LH_USER@$LH_HOST"

          echo "::group::服务器环境（A）"
          $SSH_CMD "whoami; hostname; echo '--- web root ---'; ls -la '$LH_ROOT' | head -20"
          echo "::endgroup::"

          # ---------- 降级护栏（上传前） ----------
          ART_VER=$(node -p "require('./package.json').version")
          LIVE_VER=$($SSH_CMD "cat '$LH_ROOT/.deployed-version' 2>/dev/null || true" \
                     | tr -d '\r\n' | head -c 64)
          echo "本次产物版本 : $ART_VER"
          echo "线上已部署版本: ${LIVE_VER:-（无记录）}"

          if [ -n "$LIVE_VER" ]; then
            if [ "$LIVE_VER" = "$ART_VER" ]; then
              echo "版本相同，按允许的重复部署处理。"
            else
              OLDEST=$(printf '%s\n%s\n' "$LIVE_VER" "$ART_VER" | sort -V | head -1)
              if [ "$OLDEST" = "$ART_VER" ]; then
                echo "::error title=拒绝降级部署::本次产物 $ART_VER 严格早于线上 $LIVE_VER，已中止以免覆盖线上较新版本。"
                echo "若确需回滚，请手工在服务器上操作，并同步更新 $LH_ROOT/.deployed-version。"
                exit 1
              fi
              echo "产物较新（$ART_VER > $LIVE_VER），允许部署。"
            fi
          else
            echo "::warning title=无线上版本记录::服务器 $LH_ROOT/.deployed-version 不存在，本次跳过降级检查。"
          fi

          # 上传前先备份现有站点，留退路（失败不阻断部署）
          $SSH_CMD "tar czf ~/webroot-backup-widget-\$(date +%F-%H%M%S).tar.gz -C '$LH_ROOT' . 2>/dev/null || true"

          # 流式上传：tar over ssh。--no-same-owner：不要把 runner 的 uid/gid 带到线上。
          tar czf - -C dist . | $SSH_CMD "tar xzf - --no-same-owner -C '$LH_ROOT'"
          $SSH_CMD "chown -R $WEB_OWNER:$WEB_OWNER '$LH_ROOT'" || true

          # 上传成功后写入版本哨兵，供下一次部署做降级比对
          $SSH_CMD "printf '%s\n' '$ART_VER' > '$LH_ROOT/.deployed-version'"
          echo "已写入版本哨兵：$LH_ROOT/.deployed-version = $ART_VER"

      # ⚠️ 自检步骤：只做体检，绝不当门禁（境外 TLS 可能被中间设备中断，
      # 而部署本身已成功）。硬门禁只保留在 Deployment 步，本步骤失败只出 warning。
      - name: Verify live site (self-check, never blocks)
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        env:
          LH_HOST: ${{ secrets.LH_HOST }}
        run: |
          set +e
          set -uo pipefail
          DOMAIN=widget.power-knowledge.tech
          URL="https://$DOMAIN/"
          LIVE=/tmp/live.html
          ok=0
          for i in 1 2 3; do
            code=$(curl -sS -o "$LIVE" -w '%{http_code}' -m 20 "$URL"); rc=$?
            echo "第 ${i} 次请求：http=$code curl_exit=$rc"
            if [ "$rc" = 0 ] && [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ] && [ -n "${LH_HOST:-}" ]; then
            code=$(curl -sS -o "$LIVE" -w '%{http_code}' -m 20 \
                   --resolve "$DOMAIN:443:$LH_HOST" "$URL"); rc=$?
            echo "改走 IP（SNI 不变）：http=$code curl_exit=$rc"
          fi
          if [ "$ok" = 1 ]; then
            LOCAL_JS=$(basename "$(ls dist/assets/index-*.js | head -1)")
            echo "本次构建入口 JS: $LOCAL_JS"
            if grep -q "$LOCAL_JS" "$LIVE"; then
              echo "::notice title=核验通过（A）::线上入口 JS 与本次构建一致（$LOCAL_JS）"
            else
              echo "::warning title=核验存疑（A）::线上入口 JS 与本次构建不一致，可能是 CDN 缓存或部署未生效"
            fi
          else
            echo "::warning title=自检未通过（A，不影响本次部署）::域名多次访问均失败。"
          fi
          exit 0

  # ═══════════════════════════════════════════════════════
  # B · 第二台（DSH 机）
  # ═══════════════════════════════════════════════════════
  deploy-secondary:
    name: B · www.wx-seastar.cn
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        env:
          LH2_HOST: ${{ secrets.LH2_HOST }}
          LH2_USER: ${{ secrets.LH2_USER }}
          LH2_ROOT: ${{ secrets.LH2_ROOT }}
          LH2_SSH_KEY: ${{ secrets.LH2_SSH_KEY }}
        run: |
          if [ -z "$LH2_HOST" ] || [ -z "$LH2_USER" ] || [ -z "$LH2_ROOT" ] || [ -z "$LH2_SSH_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=已跳过轻量云部署（B 组）::未配置 LH2_HOST/LH2_USER/LH2_ROOT/LH2_SSH_KEY，本次不上传任何文件。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "B 组配置齐备，将部署到 $LH2_USER@$LH2_HOST:$LH2_ROOT"
          fi

      - name: Setup Node
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - name: Build
        if: steps.cfg.outputs.ready == 'true'
        run: npm run build

      - name: Deploy to server over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          LH2_HOST: ${{ secrets.LH2_HOST }}
          LH2_USER: ${{ secrets.LH2_USER }}
          LH2_ROOT: ${{ secrets.LH2_ROOT }}
          LH2_SSH_KEY: ${{ secrets.LH2_SSH_KEY }}
          LH2_PORT: ${{ secrets.LH2_PORT }}
        run: |
          set -euo pipefail
          PORT="${LH2_PORT:-22}"
          WEB_OWNER=www-data

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$LH2_SSH_KEY" > ~/.ssh/lh2_key
          chmod 600 ~/.ssh/lh2_key
          ssh-keyscan -p "$PORT" -H "$LH2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_CMD="ssh -p $PORT -i $HOME/.ssh/lh2_key -o BatchMode=yes -o ConnectTimeout=20 $LH2_USER@$LH2_HOST"

          echo "::group::服务器环境（B）"
          $SSH_CMD "whoami; hostname; echo '--- web root ---'; ls -la '$LH2_ROOT' | head -20"
          echo "::endgroup::"

          # ---------- 降级护栏（上传前） ----------
          ART_VER=$(node -p "require('./package.json').version")
          LIVE_VER=$($SSH_CMD "cat '$LH2_ROOT/.deployed-version' 2>/dev/null || true" \
                     | tr -d '\r\n' | head -c 64)
          echo "本次产物版本 : $ART_VER"
          echo "线上已部署版本: ${LIVE_VER:-（无记录）}"

          if [ -n "$LIVE_VER" ]; then
            if [ "$LIVE_VER" = "$ART_VER" ]; then
              echo "版本相同，按允许的重复部署处理。"
            else
              OLDEST=$(printf '%s\n%s\n' "$LIVE_VER" "$ART_VER" | sort -V | head -1)
              if [ "$OLDEST" = "$ART_VER" ]; then
                echo "::error title=拒绝降级部署（B）::本次产物 $ART_VER 严格早于线上 $LIVE_VER，已中止。"
                exit 1
              fi
              echo "产物较新（$ART_VER > $LIVE_VER），允许部署。"
            fi
          else
            echo "::warning title=无线上版本记录（B）::$LH2_ROOT/.deployed-version 不存在，跳过降级检查。"
          fi

          # 上传前备份
          $SSH_CMD "tar czf ~/webroot-backup-widget-\$(date +%F-%H%M%S).tar.gz -C '$LH2_ROOT' . 2>/dev/null || true"

          tar czf - -C dist . | $SSH_CMD "tar xzf - --no-same-owner -C '$LH2_ROOT'"
          $SSH_CMD "chown -R $WEB_OWNER:$WEB_OWNER '$LH2_ROOT'" || true

          $SSH_CMD "printf '%s\n' '$ART_VER' > '$LH2_ROOT/.deployed-version'"
          echo "已写入版本哨兵：$LH2_ROOT/.deployed-version = $ART_VER"

      - name: Verify live site (self-check, never blocks)
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        env:
          LH2_HOST: ${{ secrets.LH2_HOST }}
        run: |
          set +e
          set -uo pipefail
          DOMAIN=www.wx-seastar.cn
          URL="https://$DOMAIN/"
          LIVE=/tmp/live-b.html
          ok=0
          for i in 1 2 3; do
            code=$(curl -sS -o "$LIVE" -w '%{http_code}' -m 20 "$URL"); rc=$?
            echo "第 ${i} 次请求：http=$code curl_exit=$rc"
            if [ "$rc" = 0 ] && [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ] && [ -n "${LH2_HOST:-}" ]; then
            code=$(curl -sS -o "$LIVE" -w '%{http_code}' -m 20 \
                   --resolve "$DOMAIN:443:$LH2_HOST" "$URL"); rc=$?
            echo "改走 IP（SNI 不变）：http=$code curl_exit=$rc"
          fi
          if [ "$ok" = 1 ]; then
            LOCAL_JS=$(basename "$(ls dist/assets/index-*.js | head -1)")
            echo "本次构建入口 JS: $LOCAL_JS"
            if grep -q "$LOCAL_JS" "$LIVE"; then
              echo "::notice title=核验通过（B）::线上入口 JS 与本次构建一致（$LOCAL_JS）"
            else
              echo "::warning title=核验存疑（B）::线上入口 JS 与本次构建不一致"
            fi
          else
            echo "::warning title=自检未通过（B，不影响本次部署）::域名多次访问均失败。"
          fi
          exit 0

# ⚠️ 本文件是服务器上 /etc/nginx/sites-available/widget 的**副本**（2026-11-02 核对一致）。
#    仓库不负责下发它 —— 改这里不会影响线上，改线上也不会自动回流。
#    正确顺序：服务器改 → nginx -t → systemctl reload nginx → 线上验证 → 再把线上文件覆盖回本文件。
#
#    为什么放进仓库：该配置此前只存在于服务器，没有任何版本控制，
#    机器一旦出事就无从恢复。2026-11-02 统一「裸名 301 到 www」时才补上这份副本。

# widget.power-knowledge.tech -- Power Widget
# 证书复用通配符 /etc/letsencrypt/live/pk-wildcard/
# ⚠️ 通配符只匹配一级子域，www.widget.power-knowledge.tech 不在 SAN 内。
#    2026-09-26：确认 DNSPod 免费版不支持为三级子域解析 TXT，故 www 名称
#    改走 HTTP-01 验证单独签发，不再依赖 DNS-01。
# 站点为 BrowserRouter 单页应用：深层路由（如 /designer）必须回落 index.html，否则刷新子页面 404。资源用相对路径（vite base "./"），故无需 rewrite。
#   · 2026-11-02: 策略反转 —— 裸名统一 301 到 www（用户要求六个子域同一规则）。
#     背景：这五个工具站都没有 canonical 标签，裸名与 www 同时 200 属重复内容，
#     301 是唯一归一手段。80 块跳转目标由 $host 改为硬编码 www；
#     443 拆为「裸名 301」+「www 服务」两块。

server {
    listen 80;
    listen [::]:80;
    server_name widget.power-knowledge.tech www.widget.power-knowledge.tech;

    include snippets/acme.conf;

    access_log /var/log/nginx/widget.access.log;
    error_log  /var/log/nginx/widget.error.log;

    location / {
        return 301 https://www.widget.power-knowledge.tech$request_uri;
    }
}

# ── 443：裸名收敛到 www（2026-11-02）──
# 与 llc / ahb / interleavedpfc / web-training 同一套规则：裸名只做 301。
# 跳转目标硬编码 www，不用 $host —— 否则 www 块里 $host 保留 www，会跳回自己成环。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name widget.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/pk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.widget.power-knowledge.tech$request_uri;
}

# ── 443：主服务（www）──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.widget.power-knowledge.tech;

    ssl_certificate     /etc/letsencrypt/live/pk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security max-age=31536000 always;

    root /var/www/widget;
    index index.html;

    include snippets/security-hardening.conf;


    # favicon 缓存策略：2026-09-29 加。
    # favicon 是浏览器缓存最顽固的资源（独立缓存、Ctrl+F5 常不生效）。
    # 这里对裸 /favicon.svg 强制每回源校验，配合 index.html 引用上的
    # ?v=<内容哈希> 版本戳（见 scripts/stamp-favicon.mjs），保证图标一改即生效。
    # 注：不要试图用 `location ~* ^/favicon\.svg\?v=` 去区分带戳请求 ——
    #     nginx 的 location 只匹配 URI 路径，不含 query string，该规则永不命中（已实测）。
    #     统一 no-cache 已足够：命中缓存仍需回源校验，代价仅是 838 字节的 304。
    location = /favicon.svg {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
